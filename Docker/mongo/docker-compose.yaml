services:
  mongodb:
    image: mongo:latest
    container_name: mongo
    network_mode: bridge
    # stdin_open: true # docker run -i
    # tty: true        # docker run -t
    ports:
      - 27017:27017
    volumes:
      - "${HOME}/NoSQL/MongoDB/db:/data/db"
      - "${HOME}/NoSQL/MongoDB/configdb:/data/configdb"
      - "${HOME}/NoSQL/MongoDB/files:/home/ubuntu"
